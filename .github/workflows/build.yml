name: Build y pruebas

# Solo comprueba: instala, prueba, compila y verifica dist/. No despliega nada
# (el despliegue lo gestiona Cloudflare Pages).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Compilación como producción (indexable): 114 páginas, 84 index,follow y 30 legales noindex. check-site.mjs lo comprueba así.
      SITE_URL: https://calculanegocio.com
      SITE_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generar lockfile si falta
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Guardar lockfile generado
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Pruebas de fórmulas y código fuente
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Comprobar dist/
        run: npm run test:dist

      - name: Instalar navegador para las pruebas visuales
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          npx playwright-core install --with-deps chromium

      - name: Maquetación (sin desplazamiento horizontal), accesibilidad y comportamiento
        run: |
          npm run test:layout
          npm run test:a11y
          npm run test:behavior
          npm run test:switcher

      - name: Capturas de pantalla (320 a 1440 px)
        run: node scripts/screenshots.mjs dist screenshots

      - name: Guardar capturas
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

      - name: Guardar dist/ para revisión
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
